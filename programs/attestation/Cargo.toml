[package]
name = "attestation"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "attestation"

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
escrow = { path = "../escrow", features = ["cpi"] }

[features]
no-entrypoint = []
test-bpf = []
idl-build = ["anchor-lang/idl-build", "escrow/idl-build"]
cpi = ["no-entrypoint"]
default = []
